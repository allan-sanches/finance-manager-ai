<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e3138" />
    <title>Sem internet · Capitalismo Selvagem</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #2e3138;
        color: #f3f4f7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        opacity: 0.75;
        max-width: 28ch;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 2px solid #0a0a0a;
        border-radius: 12px;
        background: #bef264;
        color: #0a0a0a;
        font: inherit;
        font-weight: 800;
        box-shadow: 3px 3px 0 0 #0a0a0a;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon/192" alt="" />
      <h1>Sem internet</h1>
      <p>Seus dados ficam no servidor. Assim que a conexão voltar, é só tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
